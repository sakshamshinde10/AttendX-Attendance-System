<script>
    (function() {
      // Animate scanner line
      const line = document.getElementById('scanner-line');
      let pos = 0;
      let direction = 1;
      
      function animateScanner() {
        pos += 0.8 * direction;
        if (pos >= 100 || pos <= 0) direction *= -1;
        line.style.top = pos + '%';
        requestAnimationFrame(animateScanner);
      }
      animateScanner();

      // Randomize signal strength for realism
      const signalText = document.getElementById('signal-strength');
      const strengths = ['-62 dBm (Excellent)', '-64 dBm (Excellent)', '-65 dBm (Good)', '-63 dBm (Excellent)'];
      
      setInterval(() => {
        const random = Math.floor(Math.random() * strengths.length);
        signalText.innerText = strengths[random];
      }, 3000);
    })();
  </script>
