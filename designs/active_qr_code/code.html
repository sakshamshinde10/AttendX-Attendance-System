<script>
        (function() {
            let timeLeft = 30;
            const timerText = document.getElementById('timer-text');
            const timerRing = document.getElementById('timer-ring');
            const studentCount = document.getElementById('student-count');
            const qrCode = document.getElementById('qr-code');
            
            let count = 0;
            const targetCount = 36;

            // Simple timer logic
            function updateTimer() {
                timeLeft--;
                if (timeLeft < 0) {
                    timeLeft = 30;
                    // Trigger a "refresh" visual effect
                    qrCode.style.opacity = '0.3';
                    setTimeout(() => {
                        qrCode.style.opacity = '1';
                    }, 300);
                }
                
                timerText.textContent = timeLeft;
                const offset = (timeLeft / 30) * 100;
                timerRing.setAttribute('stroke-dasharray', `${offset} 100`);
            }

            // Simulate student joins
            function incrementStudents() {
                if (count < targetCount) {
                    count += Math.floor(Math.random() * 3) + 1;
                    if (count > targetCount) count = targetCount;
                    studentCount.textContent = count;
                    
                    // Add a little pop animation
                    studentCount.animate([
                        { transform: 'scale(1.2)', color: '#0052cc' },
                        { transform: 'scale(1)', color: 'white' }
                    ], { duration: 400 });
                }
            }

            setInterval(updateTimer, 1000);
            setInterval(incrementStudents, 4000);

            // Micro-interaction for the QR code
            qrCode.parentElement.addEventListener('click', () => {
                timeLeft = 30;
                qrCode.style.transform = 'scale(0.95)';
                setTimeout(() => qrCode.style.transform = 'scale(1)', 150);
            });
        })();
    </script>
