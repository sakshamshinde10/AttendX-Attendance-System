    (function() {
      const container = document.getElementById('particle-container');
      const colors = ['#4edea3', '#b2c5ff', '#ffb3ad', '#006c49'];
      
      for (let i = 0; i < 24; i++) {
        const particle = document.createElement('div');
        const size = Math.random() * 8 + 4;
        const color = colors[Math.floor(Math.random() * colors.length)];
        
        particle.style.position = 'absolute';
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.backgroundColor = color;
        particle.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        particle.style.left = `${Math.random() * 100}%`;
        particle.style.top = `${Math.random() * 100}%`;
        particle.style.opacity = '0';
        particle.style.transform = `rotate(${Math.random() * 360}deg)`;
        
        container.appendChild(particle);
        
        const animation = particle.animate([
          { transform: `translate(0, 0) rotate(0deg)`, opacity: 0 },
          { transform: `translate(${(Math.random() - 0.5) * 100}px, -100px) rotate(${Math.random() * 360}deg)`, opacity: 0.6, offset: 0.5 },
          { transform: `translate(${(Math.random() - 0.5) * 200}px, -200px) rotate(${Math.random() * 720}deg)`, opacity: 0 }

          duration: 2000 + Math.random() * 3000,
          iterations: Infinity,
          delay: Math.random() * 2000
        });
      }
    })();
