  </head><body class="bg-surface font-body-md"><main class="relative w-full min-h-screen"><div class="flex flex-col w-full relative overflow-hidden" style="height: 100dvh;">
<!-- Ambient Background Shimmer -->
<div class="absolute inset-0 bg-gradient-to-br from-primary via-primary-container to-primary-fixed overflow-hidden">
<div class="absolute inset-0 opacity-30 pointer-events-none" id="shimmer-container"></div>
</div>
<!-- Content Layer -->
<div class="relative z-10 flex flex-col items-center justify-between h-full px-margin-mobile py-xl">
<!-- Top Spacer for centering -->
<div class="h-16"></div>
<!-- Central Logo Area -->
<div class="flex flex-col items-center animate-in fade-in zoom-in duration-1000 ease-out">
<!-- Glassmorphic Container for Logo -->
<div class="relative group">
<div class="absolute -inset-4 bg-white/10 backdrop-blur-xl rounded-full scale-110 animate-pulse"></div>
<div class="relative bg-white/5 backdrop-blur-md p-lg rounded-3xl shadow-xl flex items-center justify-center overflow-hidden">
<!-- Subtle Inner Glow -->
<div class="absolute inset-0 bg-gradient-to-tr from-white/10 to-transparent pointer-events-none"></div>
<img alt="Smart Wireless Attendance Logo" class="w-32 h-32 md:w-40 md:h-40 object-contain drop-shadow-2xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBfd8D0mvSE6l4-RvHb0kqUgNNGSlJLeXl3jqYcGoRUPXUdtaPPZLvL3L3Gz0toyWijkf0S6FuviIQS87vpe3hUgPmtTIe28cthuB0PdP4g6jqF9xdcRCGL-T3sdXuaXOQWIgTs2RqIkL78c371ljsoI2g8lGdcmU0RbRRV6go8z4oqC6IUxNpp2VxwC6w5ke1pEzvMNX1ZfS3aRY9rC0dmWUGA8V04Hkg1UBXFqpkswcXnr1VIasFf"/>
</div>
</div>
<!-- Text Branding -->
<div class="mt-xl text-center space-y-base">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-primary tracking-tight">
          Smart Wireless
        </h1>
<p class="font-label-lg text-label-lg text-on-primary-container/80 tracking-widest uppercase">
          Attendance System
        </p>
</div>
</div>
<!-- Footer Branding -->
<div class="flex flex-col items-center space-y-sm animate-in slide-in-from-bottom duration-700 delay-300">
<div class="h-1 w-12 bg-on-primary-container/20 rounded-full overflow-hidden">
<div class="h-full bg-secondary-fixed w-0 transition-all duration-[3000ms] ease-out" id="progress-bar"></div>
</div>
<p class="font-label-lg text-label-lg text-on-primary-container/60">
        Powered by <span class="font-semibold text-on-primary-container">Smart Wireless</span>
</p>
</div>
</div>
<script>
    (function() {
      // Shimmer Particle Generation
      const container = document.getElementById('shimmer-container');
      const particleCount = 12;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        const size = Math.random() * 300 + 100;
        const duration = Math.random() * 10 + 10;
        const delay = Math.random() * 5;
        
        particle.className = 'absolute rounded-full bg-white/10 backdrop-blur-3xl';
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${Math.random() * 100}%`;
        particle.style.top = `${Math.random() * 100}%`;
        particle.style.filter = 'blur(40px)';
        
        // CSS Animation for floating
        particle.animate([
          { transform: 'translate(0, 0) scale(1)', opacity: 0.1 },
          { transform: `translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px) scale(1.2)`, opacity: 0.3 },
          { transform: 'translate(0, 0) scale(1)', opacity: 0.1 }
        ], {
          duration: duration * 1000,
          iterations: Infinity,
          easing: 'ease-in-out',
          delay: delay * 1000
        });
        
        container.appendChild(particle);
      }

      // Progress Bar Animation
      setTimeout(() => {
        const bar = document.getElementById('progress-bar');
        if (bar) bar.style.width = '100%';
      }, 100);

      // Simple click-to-proceed visual feedback
      document.body.addEventListener('click', () => {
          const mainContent = document.querySelector('.relative.z-10');
          if(mainContent) {
              mainContent.classList.add('transition-opacity', 'duration-500', 'opacity-0');
          }
      }, { once: true });
    })();
  </script>
</div>
<!-- Extra styles for glassmorphism shimmer edge cases -->
<style>
  @keyframes shimmer-sweep {
    0% { transform: translateX(-150%) skewX(-20deg); }
    100% { transform: translateX(150%) skewX(-20deg); }
  }
  .glass-shimmer::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      to right,
      transparent,
      rgba(255, 255, 255, 0.1),
      transparent
    );
    animation: shimmer-sweep 3s infinite;
  }
