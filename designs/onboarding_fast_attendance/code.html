<svg class="absolute top-0 left-0 w-full h-full opacity-20" viewbox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
<circle class="animate-pulse" cx="10%" cy="20%" fill="url(#grad1)" r="80" style="animation-duration: 8s;">

<span class="material-symbols-outlined text-on-primary-fixed-variant" style="font-variation-settings: 'FILL' 1;">sensors</span>
</div>
</div>
</div>
<!-- Content Card -->
<div class="relative -mt-12 px-margin-mobile pb-xl">
<div class="bg-surface-container-lowest/80 backdrop-blur-xl rounded-[32px] p-lg shadow-xl flex flex-col items-center text-center">

<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-sm">
                Fast Attendance

<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px]">
                Forget the roll call. Just tap your phone or walk into the zone to mark your presence instantly.
            </p>
<!-- Interaction Section -->
<div class="w-full mt-xl">
<button class="group relative w-full h-14 bg-primary text-on-primary rounded-full font-title-lg text-title-lg flex items-center justify-center gap-sm overflow-hidden active:scale-95 transition-transform duration-200" id="next-button">
<!-- Shimmer Effect -->
<div class="absolute inset-0 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-1000 bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
<span>Next</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
<!-- Secondary Label -->
<button class="mt-md px-lg py-sm font-label-lg text-label-lg text-outline uppercase tracking-widest hover:text-primary transition-colors">
                Skip Intro
            </button>
</div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const nextBtn = document.getElementById('next-button');
        
        // Simple haptic-like feedback visual
        nextBtn.addEventListener('click', (e) => {
            const circle = document.createElement('span');
            const diameter = Math.max(nextBtn.clientWidth, nextBtn.clientHeight);
            const radius = diameter / 2;

            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${e.clientX - nextBtn.getBoundingClientRect().left - radius}px`;
            circle.style.top = `${e.clientY - nextBtn.getBoundingClientRect().top - radius}px`;
            circle.classList.add('absolute', 'bg-white/30', 'rounded-full', 'transform', 'scale-0', 'animate-ping');
            
            nextBtn.appendChild(circle);
            
            setTimeout(() => {
                circle.remove();
            }, 600);
        });
    });
</script>
<style>
    @keyframes ping {
        0% { transform: scale(0); opacity: 1; }
        100% { transform: scale(4); opacity: 0; }
    }
    .animate-ping {
        animation: ping 0.6s cubic-bezier(0, 0, 0.2, 1) forwards;
    }
